<!--
  PROTOTYPE — throwaway, answers one question, then gets captured/deleted.
  Ticket: .scratch/phase-4-frontend-mvp/tickets/04-authenticated-shell.md

  SOURCE GROUNDING: read directly from the original Figma Make file's real
  App.tsx (fileKey uecnUKqT4CI7LuIpWo50Pp, src/app/App.tsx, lines ~159-235 for
  Sidebar/TopBar, ~1204-1240 for the App shell composition) via
  ReadMcpResourceTool — not reconstructed from the ticket-01 research summary.

  CORRECTION to ticket 01 (Design tokens) research, worth flagging: that
  research claimed "the design uses shadcn/ui's full Sidebar primitive set
  (16rem/3rem/18rem widths)". Reading the actual App.tsx shows this is WRONG —
  the real `Sidebar` is a hand-rolled `<aside className="w-60 ...">` (240px
  fixed), not the shadcn primitive at all (no SidebarProvider/SidebarContent
  import anywhere in App.tsx, grepped and confirmed absent). It also has ZERO
  responsive/mobile handling — no hamburger, no Sheet, no breakpoint collapse.
  The real NAV_ITEMS (7, exact from source): Discover, Categories, My Reviews,
  Saved, Notifications, Profile, Settings — Phase 4 ships only the first 3
  (map decision). Real TopBar: per-screen title/subtitle, a notification bell
  with unread-count badge, an avatar+name button. Real sidebar user chip:
  avatar + name + role/badge-count line ("Elite Reviewer · 127" — Phase 5
  gamification language, adapted here) + overflow icon.

  The 3 variants below answer this ticket's two real open questions: (1) absent
  vs. disabled "coming soon" treatment for Saved/Notifications/Profile/Settings,
  and (2) since the source has NO mobile pattern at all, what Phase 4's mobile
  nav should actually be (a gap this ticket has to fill, not just port).
    A — faithful adaptation: real w-60 sidebar, only the 3 Phase-4 items exist
        (others fully absent), a hamburger + slide-over added for mobile (the
        gap the source left unaddressed).
    B — same w-60 sidebar, but all 7 items render — the 4 out-of-scope ones are
        visibly present but locked/dimmed with a "Soon" tag, signaling the full
        product roadmap rather than hiding it.
    C — structurally different: a collapsed icon-only rail (not a labeled
        sidebar) that expands on toggle, top bar becomes primary with an inline
        search field (ties to Discover being the default screen).
  All 3 also add a real Phase-4 necessity the ticket's Question didn't mention:
  an actual sign-out affordance (avatar dropdown → "Log out") — Profile/Settings
  aren't built yet, but a logged-in user still needs an exit door.

  Run: open this file directly in a browser, or
    cd .scratch/phase-4-frontend-mvp/prototypes/authenticated-shell
    python3 -m http.server 8000   # then visit http://localhost:8000
  Variants: ?variant=A (absent items, mobile hamburger) | B (locked "Soon" items) | C (icon-rail)
-->

<script>
  const SCREEN_META = {
    discover: { title: 'Discover Places', subtitle: 'Find and explore places near you', icon: 'search' },
    categories: { title: 'Categories', subtitle: 'Browse places by type', icon: 'grid-3x3' },
    'my-reviews': { title: 'My Reviews', subtitle: 'All your published reviews', icon: 'message-square' },
  };
  function screenPlaceholder(screen) {
    const m = SCREEN_META[screen];
    return `<div class="border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">
      <i data-lucide="${m.icon}" class="w-8 h-8 mx-auto mb-3"></i>
      <p class="text-sm font-medium text-slate-500">${m.title} content</p>
      <p class="text-xs text-slate-400 mt-1">Built out in its own ticket — this shell only proves the nav + top bar work.</p>
    </div>`;
  }
  function setScreen(scope, screen) {
    const root = document.querySelector(`[data-variant="${scope.toUpperCase()}"]`);
    root.querySelectorAll('[data-screen]').forEach(el => el.classList.toggle('active', el.dataset.screen === screen));
    const m = SCREEN_META[screen];
    const titleEl = document.getElementById(`${scope}-title`);
    const subEl = document.getElementById(`${scope}-subtitle`);
    if (titleEl) titleEl.textContent = m.title;
    if (subEl) subEl.textContent = m.subtitle;
    document.getElementById(`${scope}-content`).innerHTML = screenPlaceholder(screen);
    if (scope === 'a') closeMobileNav('a');
    lucide.createIcons();
  }
  function toggleSidebarCollapse() {
    document.getElementById('a-sidebar').classList.toggle('collapsed');
  }
  function openMobileNav(scope) {
    document.getElementById(`${scope}-sidebar`).classList.remove('-translate-x-full');
    document.getElementById(`${scope}-overlay`).classList.remove('hidden');
  }
  function closeMobileNav(scope) {
    document.getElementById(`${scope}-sidebar`)?.classList.add('-translate-x-full');
    document.getElementById(`${scope}-overlay`)?.classList.add('hidden');
  }
  document.querySelectorAll('.dropdown').forEach(d => d.id);
  function toggleDropdown(id) {
    document.querySelectorAll('.dropdown').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
    document.getElementById(id).classList.toggle('open');
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('button') || !e.target.closest('button').onclick?.toString().includes('toggleDropdown')) {
      if (!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
    }
  });

  ['a','b','c'].forEach(scope => {
    document.getElementById(`${scope}-content`).innerHTML = screenPlaceholder('discover');
  });

  // --- switcher ---
  const variants = [
    { key: 'A', name: 'Absent items, mobile hamburger' },
    { key: 'B', name: 'Locked "Soon" items' },
    { key: 'C', name: 'Icon-rail, top-bar-primary' },
  ];
  function currentIndex() {
    const v = new URLSearchParams(location.search).get('variant') || 'A';
    const i = variants.findIndex(x => x.key === v);
    return i === -1 ? 0 : i;
  }
  function render() {
    const i = currentIndex();
    document.querySelectorAll('[data-variant]').forEach(el => el.classList.toggle('active', el.dataset.variant === variants[i].key));
    document.getElementById('variant-label').textContent = `${variants[i].key} — ${variants[i].name}`;
    lucide.createIcons();
  }
  function go(delta) {
    const i = (currentIndex() + delta + variants.length) % variants.length;
    const params = new URLSearchParams(location.search);
    params.set('variant', variants[i].key);
    history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
    render();
  }
  document.getElementById('prev-btn').addEventListener('click', () => go(-1));
  document.getElementById('next-btn').addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  render();
</script>

</body>
</html>
