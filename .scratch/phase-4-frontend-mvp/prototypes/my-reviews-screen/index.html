<!--
  PROTOTYPE — throwaway, answers one question, then gets captured/deleted.
  Ticket: .scratch/phase-4-frontend-mvp/tickets/08-my-reviews-screen.md

  Hosted inside the exact approved shell from ticket 04 (pulled verbatim from
  throwaway branch prototype/authenticated-shell), same pattern as the
  Discover/Categories tickets.

  SOURCE GROUNDING: read the real `MyReviewsScreen` component directly from
  the Figma Make file's App.tsx (fileKey uecnUKqT4CI7LuIpWo50Pp, ~lines
  590-696), from the same cached fetch used for the Discover/Categories
  tickets.

  DECISIONS made while grounding:
  - **Stats: 3 cards, not 4** — real source has a 4th "Contribution Level:
    Elite" card; dropped per this map's charting decision. Kept Total Reviews
    / Helpful Votes / Businesses, computed client-side from the full
    `myReviews` list (Helpful Votes = sum of each review's `helpfulCount`).
  - **Review photos removed** — the real source's cards show photo thumbnails
    + an "add photo" control; dropped per the Place detail ticket's already-
    established decision (review photos are Phase 8 Media, out of scope
    project-wide).
  - **Edit wired to a real inline form** — the real source's Edit button has
    no onClick at all (decorative even in the mock). Built a self-contained
    star+textarea inline edit here.
  - **Delete gets a confirm step** — real source deletes immediately; added a
    confirmation since this is a real destructive action.
  - Share kept as-is — no backend gap, sharing is inherently frontend-only.

  THIS TICKET'S OWN OPEN QUESTION — Published/Drafts tabs — folded into the
  variant comparison rather than decided upfront:
    A — faithful, NO Drafts tab (no backend draft concept, dropped entirely).
    B — Drafts tab KEPT, but explicitly client-side-only / this-device-only
        (localStorage, never sent to the API) — a real but limited feature,
        with a visible note saying so.
    C — structurally different: no dashboard-style stats-card grid at all —
        stats condense into a slim chip row, the review list is promoted
        higher, and "most helpful" becomes a ribbon badge on that review's
        card instead of a separate banner. No Drafts tab (same call as A, via
        a different structure).

  Run: open this file directly in a browser, or
    cd .scratch/phase-4-frontend-mvp/prototypes/my-reviews-screen
    python3 -m http.server 8000   # then visit http://localhost:8000
  Variants: ?variant=A (no drafts) | B (drafts, local-only) | C (content-forward, no drafts)
-->

<script>
  const REVIEWS = JSON.parse(document.getElementById('review-data-template').textContent);
  const DRAFTS_KEY = 'rmp-prototype-review-drafts';
  function loadDrafts() {
    let d = JSON.parse(localStorage.getItem(DRAFTS_KEY) || 'null');
    if (!d) {
      d = [{ id: 'draft-1', business: 'The Copper Skillet', image: 'photo-1517248135467-4c7edcad34c4', rating: 4, text: "Really enjoyed the tasting menu, still need to finish writing this up..." }];
      localStorage.setItem(DRAFTS_KEY, JSON.stringify(d));
    }
    return d;
  }
  function deleteDraft(id) {
    const d = loadDrafts().filter(x => x.id !== id);
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(d));
    renderVariantB();
  }

  function starsHtml(rating, size) {
    let s = '';
    for (let i = 0; i < 5; i++) s += `<i data-lucide="star" class="${size || 'w-3.5 h-3.5'} ${i < rating ? 'text-accent fill-accent' : 'text-slate-200 fill-slate-200'}"></i>`;
    return s;
  }
  function statCardHtml(icon, colorClass, value, label) {
    return `<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
      <div class="w-9 h-9 rounded-xl ${colorClass} flex items-center justify-center mb-2"><i data-lucide="${icon}" class="w-4 h-4"></i></div>
      <p class="heading text-2xl font-extrabold">${value}</p>
      <p class="text-xs text-slate-500 mt-0.5">${label}</p>
    </div>`;
  }
  function helpfulBannerHtml(review) {
    return `<div class="bg-gradient-to-r from-amber-500 to-amber-400 rounded-2xl p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><i data-lucide="award" class="w-6 h-6 text-white"></i></div>
      <div class="flex-1">
        <p class="text-white font-bold text-sm">Most Helpful Review</p>
        <p class="text-amber-100 text-xs mt-0.5">Your ${review.business} review has been marked helpful ${review.helpfulCount} times — your most impactful review yet!</p>
      </div>
    </div>`;
  }
  function emptyStateHtml() {
    return `<div class="text-center py-20 bg-white rounded-2xl border border-slate-200">
      <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-4"><i data-lucide="message-square" class="w-8 h-8 text-slate-300"></i></div>
      <p class="font-bold text-slate-700 mb-1">No reviews yet</p>
      <p class="text-sm text-slate-500 mb-4">You haven't written any reviews yet.</p>
      <button onclick="setScreen('discover')" class="inline-flex items-center gap-2 bg-primary text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700"><i data-lucide="search" class="w-4 h-4"></i>Discover Places</button>
    </div>`;
  }

  function reviewCardHtml(r, opts) {
    opts = opts || {};
    const ribbon = opts.ribbon ? `<div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-bl-xl flex items-center gap-1"><i data-lucide="award" class="w-3 h-3"></i>Most Helpful</div>` : '';
    return `<div class="relative bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow" id="review-card-${r.id}">
      ${ribbon}
      <div class="flex items-start gap-4 p-5">
        <img src="https://images.unsplash.com/${r.image}?w=100&h=100&fit=crop&auto=format" class="w-14 h-14 rounded-xl object-cover bg-slate-100 flex-shrink-0" />
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h3 class="font-bold text-sm">${r.business}</h3>
              <div class="flex items-center gap-2 mt-1">
                <div class="flex gap-0.5">${starsHtml(r.rating)}</div>
                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${r.date}</span>
              </div>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
              <button onclick="openInlineEdit(${r.id})" class="w-8 h-8 rounded-lg hover:bg-blue-50 flex items-center justify-center text-slate-400 hover:text-primary transition-colors"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
              <button class="w-8 h-8 rounded-lg hover:bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors"><i data-lucide="share-2" class="w-3.5 h-3.5"></i></button>
              <button onclick="confirmDeleteReview(${r.id})" class="w-8 h-8 rounded-lg hover:bg-rose-50 flex items-center justify-center text-slate-400 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
          <p id="review-text-${r.id}" class="text-sm text-slate-600 leading-relaxed mt-2">${r.text}</p>
          <div id="review-edit-${r.id}" class="hidden mt-3"></div>
          <div class="flex items-center gap-1.5 mt-3 text-xs text-slate-400">
            <i data-lucide="thumbs-up" class="w-3.5 h-3.5 text-emerald-500"></i>
            <span class="text-emerald-600 font-semibold">${r.helpfulCount} people</span> found this helpful
          </div>
        </div>
      </div>
    </div>`;
  }

  function inlineEditFormHtml(r) {
    return `<div class="border-t border-slate-100 pt-3">
      <div class="star-pick flex gap-1 mb-2" id="edit-stars-${r.id}"></div>
      <textarea id="edit-text-${r.id}" class="field text-sm" rows="3">${r.text}</textarea>
      <div class="flex gap-2 mt-2">
        <button onclick="saveInlineEdit(${r.id})" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700">Save changes</button>
        <button onclick="closeInlineEdit(${r.id})" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-50">Cancel</button>
      </div>
    </div>`;
  }
  let editingRating = {};
  function openInlineEdit(id) {
    const r = REVIEWS.find(x => x.id === id);
    editingRating[id] = r.rating;
    document.getElementById(`review-text-${id}`).classList.add('hidden');
    const editEl = document.getElementById(`review-edit-${id}`);
    editEl.innerHTML = inlineEditFormHtml(r);
    editEl.classList.remove('hidden');
    renderEditStars(id);
    lucide.createIcons();
  }
  function renderEditStars(id) {
    document.getElementById(`edit-stars-${id}`).innerHTML = [1,2,3,4,5].map(n =>
      `<i data-lucide="star" class="w-5 h-5 ${n <= editingRating[id] ? 'text-accent fill-accent' : 'text-slate-200 fill-slate-200'}" onclick="setEditRating(${id},${n})"></i>`
    ).join('');
    lucide.createIcons();
  }
  function setEditRating(id, n) { editingRating[id] = n; renderEditStars(id); }
  function closeInlineEdit(id) {
    document.getElementById(`review-text-${id}`).classList.remove('hidden');
    document.getElementById(`review-edit-${id}`).classList.add('hidden');
  }
  function saveInlineEdit(id) {
    const r = REVIEWS.find(x => x.id === id);
    r.text = document.getElementById(`edit-text-${id}`).value;
    r.rating = editingRating[id];
    closeInlineEdit(id);
    renderAll();
  }
  function confirmDeleteReview(id) {
    if (!confirm('Delete this review? This can\'t be undone.')) return;
    const idx = REVIEWS.findIndex(x => x.id === id);
    if (idx !== -1) REVIEWS.splice(idx, 1);
    renderAll();
  }

  function computeStats() {
    const total = REVIEWS.length;
    const helpful = REVIEWS.reduce((sum, r) => sum + r.helpfulCount, 0);
    const businesses = new Set(REVIEWS.map(r => r.business)).size;
    return { total, helpful, businesses };
  }
  function mostHelpful() {
    return REVIEWS.length ? REVIEWS.reduce((a, b) => b.helpfulCount > a.helpfulCount ? b : a) : null;
  }

  function renderVariantA() {
    const s = computeStats();
    document.getElementById('ma-stats').innerHTML =
      statCardHtml('message-square', 'text-primary bg-blue-50', s.total, 'Total Reviews') +
      statCardHtml('thumbs-up', 'text-emerald-600 bg-emerald-50', s.helpful, 'Helpful Votes') +
      statCardHtml('building-2', 'text-amber-600 bg-amber-50', s.businesses, 'Businesses');
    const mh = mostHelpful();
    document.getElementById('ma-helpful-banner').innerHTML = mh ? helpfulBannerHtml(mh) : '';
    document.getElementById('ma-list').innerHTML = REVIEWS.length
      ? `<div class="space-y-4">${REVIEWS.map(r => reviewCardHtml(r)).join('')}</div>`
      : emptyStateHtml();
  }

  let mbTab = 'published';
  function setMbTab(tab) { mbTab = tab; renderVariantB(); }
  function renderVariantB() {
    const s = computeStats();
    document.getElementById('mb-stats').innerHTML =
      statCardHtml('message-square', 'text-primary bg-blue-50', s.total, 'Total Reviews') +
      statCardHtml('thumbs-up', 'text-emerald-600 bg-emerald-50', s.helpful, 'Helpful Votes') +
      statCardHtml('building-2', 'text-amber-600 bg-amber-50', s.businesses, 'Businesses');
    const mh = mostHelpful();
    document.getElementById('mb-helpful-banner').innerHTML = (mh && mbTab === 'published') ? helpfulBannerHtml(mh) : '';
    const drafts = loadDrafts();
    const tabActiveCls = 'bg-white text-primary shadow-sm';
    const tabInactiveCls = 'text-slate-500 hover:text-slate-700';
    document.getElementById('mb-tab-published').className = `px-4 py-2 rounded-lg text-sm font-semibold transition-all ${mbTab === 'published' ? tabActiveCls : tabInactiveCls}`;
    document.getElementById('mb-tab-published').textContent = `Published (${REVIEWS.length})`;
    document.getElementById('mb-tab-drafts').className = `px-4 py-2 rounded-lg text-sm font-semibold transition-all ${mbTab === 'drafts' ? tabActiveCls : tabInactiveCls}`;
    document.getElementById('mb-tab-drafts').textContent = `Drafts (${drafts.length})`;
    document.getElementById('mb-drafts-note').classList.toggle('hidden', mbTab !== 'drafts');

    if (mbTab === 'published') {
      document.getElementById('mb-list').innerHTML = REVIEWS.length ? `<div class="space-y-4">${REVIEWS.map(r => reviewCardHtml(r)).join('')}</div>` : emptyStateHtml();
    } else {
      document.getElementById('mb-list').innerHTML = drafts.length ? `<div class="space-y-4">${drafts.map(d => `
        <div class="bg-white rounded-2xl border border-dashed border-amber-300 shadow-sm overflow-hidden">
          <div class="flex items-start gap-4 p-5">
            <img src="https://images.unsplash.com/${d.image}?w=100&h=100&fit=crop&auto=format" class="w-14 h-14 rounded-xl object-cover bg-slate-100 flex-shrink-0" />
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="font-bold text-sm">${d.business}</h3>
                  <div class="flex items-center gap-2 mt-1">
                    <div class="flex gap-0.5">${starsHtml(d.rating)}</div>
                    <span class="text-[10px] font-bold uppercase bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">Draft</span>
                  </div>
                </div>
                <button onclick="deleteDraft('${d.id}')" class="w-8 h-8 rounded-lg hover:bg-rose-50 flex items-center justify-center text-slate-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
              <p class="text-sm text-slate-600 leading-relaxed mt-2">${d.text}</p>
              <button class="mt-3 bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700">Continue writing</button>
            </div>
          </div>
        </div>`).join('')}</div>` : `<div class="text-center py-16 bg-white rounded-2xl border border-slate-200"><p class="text-sm text-slate-500">No drafts saved on this device.</p></div>`;
    }
    lucide.createIcons();
  }

  function renderVariantC() {
    const s = computeStats();
    document.getElementById('mc-chips').innerHTML = `
      <span class="font-bold heading text-lg">${s.total} reviews</span>
      <span class="text-slate-300">·</span>
      <span class="text-slate-600 flex items-center gap-1"><i data-lucide="thumbs-up" class="w-3.5 h-3.5 text-emerald-500"></i>${s.helpful} helpful votes</span>
      <span class="text-slate-300">·</span>
      <span class="text-slate-600">${s.businesses} places</span>
    `;
    const mh = mostHelpful();
    document.getElementById('mc-list').innerHTML = REVIEWS.length
      ? `<div class="space-y-4">${REVIEWS.map(r => reviewCardHtml(r, { ribbon: mh && r.id === mh.id })).join('')}</div>`
      : emptyStateHtml();
    lucide.createIcons();
  }

  function renderAll() {
    renderVariantA();
    renderVariantB();
    renderVariantC();
    lucide.createIcons();
  }
  renderAll();

  // --- shell chrome behavior (verbatim from the approved ticket-04 prototype) ---
  const SCREEN_META = {
    discover: { title: 'Discover Places', subtitle: 'Find and explore places near you', icon: 'search' },
    categories: { title: 'Categories', subtitle: 'Browse places by type', icon: 'grid-3x3' },
    'my-reviews': { title: 'My Reviews', subtitle: 'All your published reviews', icon: 'message-square' },
  };
  function setScreen(screen) {
    document.querySelectorAll('[data-screen]').forEach(el => el.classList.toggle('active', el.dataset.screen === screen));
    const m = SCREEN_META[screen];
    document.getElementById('shell-title').textContent = m.title;
    document.getElementById('shell-subtitle').textContent = m.subtitle;
    document.getElementById('myreviews-content').classList.toggle('hidden', screen !== 'my-reviews');
    document.getElementById('non-myreviews-placeholder').classList.toggle('hidden', screen === 'my-reviews');
    if (screen !== 'my-reviews') {
      document.getElementById('placeholder-icon').setAttribute('data-lucide', m.icon);
      document.getElementById('placeholder-title').textContent = `${m.title} content`;
    }
    closeMobileNav();
    lucide.createIcons();
  }
  function toggleSidebarCollapse() { document.getElementById('shell-sidebar').classList.toggle('collapsed'); }
  function openMobileNav() {
    document.getElementById('shell-sidebar').classList.remove('-translate-x-full');
    document.getElementById('shell-overlay').classList.remove('hidden');
  }
  function closeMobileNav() {
    document.getElementById('shell-sidebar')?.classList.add('-translate-x-full');
    document.getElementById('shell-overlay')?.classList.add('hidden');
  }
  function toggleDropdown(id) {
    document.querySelectorAll('.dropdown').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
    document.getElementById(id).classList.toggle('open');
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('button') || !e.target.closest('button').onclick?.toString().includes('toggleDropdown')) {
      if (!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
    }
  });

  // --- My Reviews layout variant switcher ---
  const variants = [
    { key: 'A', name: 'No Drafts tab' },
    { key: 'B', name: 'Drafts, local-only' },
    { key: 'C', name: 'Content-forward, no drafts' },
  ];
  function currentIndex() {
    const v = new URLSearchParams(location.search).get('variant') || 'A';
    const i = variants.findIndex(x => x.key === v);
    return i === -1 ? 0 : i;
  }
  function renderSwitcher() {
    const i = currentIndex();
    document.querySelectorAll('[data-mr-variant]').forEach(el => el.classList.toggle('active', el.dataset.mrVariant === variants[i].key));
    document.getElementById('variant-label').textContent = `${variants[i].key} — ${variants[i].name}`;
    lucide.createIcons();
  }
  function go(delta) {
    const i = (currentIndex() + delta + variants.length) % variants.length;
    const params = new URLSearchParams(location.search);
    params.set('variant', variants[i].key);
    history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
    renderSwitcher();
  }
  document.getElementById('prev-btn').addEventListener('click', () => go(-1));
  document.getElementById('next-btn').addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  renderSwitcher();
</script>

</body>
</html>
