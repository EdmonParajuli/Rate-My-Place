query MyReviews($first: Int, $after: String) {
  myReviews(first: $first, after: $after) {
    data {
      id
      review
      rating
      createdAt
      helpfulCount
      place {
        id
        label
        address
        priceRange
        averageRating
        reviewCount
        isVerified
        openNow
        trendingScore
        category {
          label
          icon
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
