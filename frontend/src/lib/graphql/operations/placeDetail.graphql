query GetPlaceById($id: Int!) {
  getPlaceById(id: $id) {
    data {
      id
      label
      description
      address
      phone
      website
      priceRange
      averageRating
      reviewCount
      isVerified
      openNow
      coverPhotoUrl
      profilePicture
      photos {
        id
        kind
        url
      }
      savedByMe
      savedListType
      category {
        id
        label
        icon
      }
      owner {
        id
        fullName
        profilePicture
      }
      hours {
        dayOfWeek
        opensAt
        closesAt
      }
      ratingBreakdown {
        stars
        count
      }
    }
  }
}

query PlaceByReviewToken($token: String!) {
  placeByReviewToken(token: $token) {
    data {
      id
      label
      description
      address
      phone
      website
      priceRange
      averageRating
      reviewCount
      isVerified
      openNow
      coverPhotoUrl
      profilePicture
      photos {
        id
        kind
        url
      }
      savedByMe
      savedListType
      category {
        id
        label
        icon
      }
      owner {
        id
        fullName
        profilePicture
      }
      hours {
        dayOfWeek
        opensAt
        closesAt
      }
      ratingBreakdown {
        stars
        count
      }
    }
  }
}

query PlaceReviews($placeId: Int!, $first: Int, $after: String, $sort: ReviewSortEnum) {
  placeReviews(placeId: $placeId, first: $first, after: $after, sort: $sort) {
    data {
      id
      review
      rating
      reviewerId
      createdAt
      helpfulCount
      helpfulByMe
      photoCount
      reviewer {
        id
        fullName
        profilePicture
      }
      reply {
        id
        description
        createdAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Single-review scoped, unlike placeReviews above - fetches a review's real
# photos on demand (edit form seeding it, or a viewer expanding "N photos" on
# a card). Never embedded in the list query - see
# docs/specs/phase-8-media-plumbing.md.
query GetReviewById($id: Int!) {
  getReviewById(id: $id) {
    data {
      id
      photoCount
      photos {
        id
        url
      }
    }
  }
}

mutation CreateReview($placeId: Int!, $input: InputReview!) {
  createReview(placeId: $placeId, input: $input) {
    message
    data { id }
  }
}

mutation UpdateReview($reviewId: Int!, $input: InputUpdateReview!) {
  updateReview(reviewId: $reviewId, input: $input) {
    message
  }
}

mutation DeleteReview($reviewId: Int!) {
  deleteReview(reviewId: $reviewId) {
    message
  }
}

mutation ToggleHelpfulVote($reviewId: Int!) {
  toggleHelpfulVote(reviewId: $reviewId) {
    message
    helpfulCount
    helpfulByMe
  }
}

mutation CreateReviewReply($reviewId: Int!, $input: InputReviewReply!) {
  createReviewReply(reviewId: $reviewId, input: $input) {
    message
  }
}
