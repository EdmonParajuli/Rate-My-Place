mutation RefreshAccessToken($input: InputRefreshAccessToken!) {
  refreshAccessToken(input: $input) {
    data {
      access
      refresh
      sessionId
    }
  }
}

query ActiveSessions {
  activeSessions {
    data {
      id
      deviceLabel
      ipAddress
      createdAt
      lastUsedAt
    }
  }
}

mutation RevokeSession($sessionId: Int!) {
  revokeSession(sessionId: $sessionId) {
    message
  }
}
