<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <!-- Applies the .dark class (already fully defined in index.css from the
         original shadcn scaffold) before React mounts, so there's no flash
         of the wrong theme on load. Explicit choice (localStorage) wins;
         otherwise falls back to the OS-level preference. Kept as plain
         inline JS, not a React effect, specifically so it runs before first
         paint - see lib/theme/ThemeContext.tsx for the React-side toggle.

         DARK_MODE_ENABLED: temporarily off (2026-08-16) - visual coverage
         had too many bugs to ship. Mechanism kept intact; flip back to true
         (and the matching flag in ThemeContext.tsx) once the coverage sweep
         lands. -->
    <script>
      (function () {
        var DARK_MODE_ENABLED = false;
        var stored = localStorage.getItem("rmp_theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (DARK_MODE_ENABLED && dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
